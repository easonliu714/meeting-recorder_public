name: Public Groq STT Lab v0.4.17+22 isolated Debug APK
on:
  push:
    branches:
      - lab/public-v021-pcm-window-evidence-20261119

permissions:
  contents: read

concurrency:
  group: public-groq-lab-v022-exact-head
  cancel-in-progress: false

jobs:
  lab-debug:
    name: Public Lab source safety, Flutter, Kotlin, APK and signer proof
    if: github.repository == 'easonliu714/meeting-recorder_public'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      EXPECTED_APP_ID: com.example.meeting_recorder.public_lab_v22.groq_stt_lab
      PUBLIC_BASE_HEAD: c0c993c00c72e79b9b72697b4b2205b66168f026
      V21_HEAD: 710e0df35d02dd6c0883db68bb34db66174c427c
      MAIN_PRIVATE_SIGNER: 211EBB33C98359E8F49F0423231826DF22B04643BE418754C939ECB2FFC1435D
      LAB_V20_PRIVATE_SIGNER: 22C00CAEA111CF5725CA17D2BA51287DFDCEEB67015BFFA2F574235447B19FC1
    steps:
      - name: Checkout exact public branch without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 3

      - name: Fail-closed scope, source and publication-safety audit
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/lab/public-v021-pcm-window-evidence-20261119
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^^)" = "$V21_HEAD"
          test "$(git rev-parse HEAD^^^)" = "$PUBLIC_BASE_HEAD"
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          root = Path('labs/groq_stt_lab')
          assert root.is_dir()
          allowed = {
              '.gitignore', '.md', '.yaml', '.dart',
              '.kt', '.py', '.sh'
          }
          tracked = subprocess.check_output(
              ['git','diff','--name-only','HEAD^^^','HEAD'],
              text=True).splitlines()
          workflow = '.github/workflows/public-groq-lab-v021-debug-apk.yml'
          assert workflow in tracked and 50 <= len(tracked) <= 65
          for name in tracked:
              if name == workflow:
                  continue
              assert name.startswith('labs/groq_stt_lab/'), name
              path = Path(name)
              assert path.is_file() and not path.is_symlink(), name
              assert path.name == '.gitignore' or path.suffix in allowed, name
          all_lab_files = [p for p in root.rglob('*') if p.is_file()]
          assert len(all_lab_files) == len(tracked) - 1
          checks = [
              r'gsk_[A-Za-z0-9_-]{20,}',
              r'AIza[0-9A-Za-z_-]{30,}',
              r'github_pat_[A-Za-z0-9_]{20,}',
              r'-----BEGIN [A-Z ]*PRIVATE KEY-----',
              r'(?i)[A-Z0-9._%+-]+@[A-Z0-9.-]+[.][A-Z]{2,}',
              r'(?i)(?:/Users/|C:.[Uu]sers.)[^ ]+',
          ]
          for path in all_lab_files:
              assert not path.is_symlink()
              raw = path.read_bytes()
              assert bytes([0]) not in raw and len(raw) < 1000000
              s = raw.decode('utf-8')
              for pattern in checks:
                  assert not re.search(pattern, s), (str(path), pattern)
          assert (root/'lib/lab_debug_log.dart').is_file()
          assert (root/'native/GroqLabAudioDecoder.kt').is_file()
          assert (root/'tool/test_pcm_diagnostics_contract.py').is_file()
          assert 'PUBLIC_LAB_TEST_TOKEN_1234567890' in (
              root/'test/lab_groq_free_stt_transport_test.dart').read_text()
          assert 'public_lab_v22' in (
              root/'tool/verify_android_identity.py').read_text()
          print('PUBLIC_LAB_ALLOWLIST_AND_SENSITIVE_SCAN_PASS', len(all_lab_files))
          PY

      - name: Set up Java and Android build tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter with cache (public standard runner)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
          pub-cache: true

      - name: Run identity/PCM fail-closed regression then generate Android
        working-directory: labs/groq_stt_lab
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tool -p 'test_*.py' -v
          bash tool/bootstrap.sh
          test ! -f android/app/upload-keystore.jks
          test ! -f android/upload-keystore.properties

      - name: Flutter dependency resolution and complete positive/negative suite
        working-directory: labs/groq_stt_lab
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test

      - name: Compile native MediaCodec and build isolated Debug APK
        working-directory: labs/groq_stt_lab
        run: |
          set -euo pipefail
          (cd android && ./gradlew :app:compileDebugKotlin --no-daemon --console=plain)
          flutter build apk --debug --no-pub --build-name=0.4.17 --build-number=22 --dart-define=LAB_BUILD_SHA="$GITHUB_SHA"
          test -s build/app/outputs/flutter-apk/app-debug.apk

      - name: APK identity, DEX, privacy signer and SHA256 provenance
        working-directory: labs/groq_stt_lab
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-debug.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          signer="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$aapt" && test -x "$signer"
          "$signer" verify --verbose --print-certs "$apk" > /tmp/public-v022-signer.txt
          grep -Eq '^Verified using v[23] scheme.*true|^Verifies$' /tmp/public-v022-signer.txt
          "$aapt" dump badging "$apk" > /tmp/public-v022-badging.txt
          grep -Fq "name='$EXPECTED_APP_ID'" /tmp/public-v022-badging.txt
          grep -Fq "versionName='0.4.17'" /tmp/public-v022-badging.txt
          grep -Fq "versionCode='22'" /tmp/public-v022-badging.txt
          grep -Fq "launchable-activity: name='$EXPECTED_APP_ID.MainActivity'" /tmp/public-v022-badging.txt
          "$aapt" dump permissions "$apk" > /tmp/public-v022-permissions.txt
          grep -Fq 'android.permission.INTERNET' /tmp/public-v022-permissions.txt
          : > /tmp/public-v022-dex.txt
          while IFS= read -r dex; do
            unzip -p "$apk" "$dex" | strings >> /tmp/public-v022-dex.txt
          done < <(unzip -Z1 "$apk" | grep -E '^classes([0-9]+)?[.]dex$')
          grep -Fq 'Lcom/example/meeting_recorder/public_lab_v22/groq_stt_lab/MainActivity;' /tmp/public-v022-dex.txt
          grep -Fq 'Lcom/example/meeting_recorder/public_lab_v22/groq_stt_lab/GroqLabAudioDecoder;' /tmp/public-v022-dex.txt
          cert="$(grep -im1 'certificate SHA-256 digest' /tmp/public-v022-signer.txt | sed -E 's/^.*digest:[[:space:]]*//' | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          [[ "$cert" =~ ^[0-9A-F]{64}$ ]]
          test "$cert" != "$MAIN_PRIVATE_SIGNER"
          test "$cert" != "$LAB_V20_PRIVATE_SIGNER"
          digest="$(sha256sum "$apk" | cut -d' ' -f1)"
          mkdir -p out
          cp "$apk" out/groq-stt-lab-v0.4.17+22-public-debug.apk
          {
            echo "REPO=easonliu714/meeting-recorder_public"
            echo "PUBLIC_BUILD_SHA=$GITHUB_SHA"
            echo "VERSION=0.4.17+22"
            echo "APPLICATION_ID=$EXPECTED_APP_ID"
            echo "APK_SHA256=$digest"
            echo "SIGNER_SHA256=$cert"
            echo "DEX_LAUNCHER_AND_DECODER=VERIFIED"
            echo "DATA_MIGRATION=NONE"
            echo "OWNER_ANDROID_UAT=NOT_VERIFIED"
            echo "GROQ_PROVIDER_E2E=NOT_VERIFIED"
            echo "REAL_AUDIO_WINDOW_GATE=FAIL_CLOSED_NO_SILENCE_PADDING"
            echo "API_KEYS_IN_CI=NONE"
          } > out/public-v022-provenance.txt
          cat out/public-v022-provenance.txt

      - name: Upload only checked Debug APK and sanitized provenance (5 days)
        uses: actions/upload-artifact@v4
        with:
          name: public-groq-lab-v022-debug
          path: labs/groq_stt_lab/out/
          retention-days: 5
          if-no-files-found: error
