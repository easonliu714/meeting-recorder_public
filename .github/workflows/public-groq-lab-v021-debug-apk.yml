name: Public Groq STT Lab v46 Gate D prefix checkpoint APK
on:
  push:
    branches:
      - lab/public-v021-pcm-window-evidence-20261119

permissions:
  contents: read

concurrency:
  group: public-groq-lab-v046-exact-head
  cancel-in-progress: false

jobs:
  lab-debug:
    name: Public Lab source safety, Flutter, Kotlin, APK and signer proof
    if: github.repository == 'easonliu714/meeting-recorder_public'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      # Authorized isolated v46 delivery; preserve accepted v39-v45 sandboxes.
      LAB_BUILD_MODE: delivery
      EXPECTED_APP_ID: com.example.meeting_recorder.public_lab_v46.groq_stt_lab
      PUBLIC_BASE_HEAD: c0c993c00c72e79b9b72697b4b2205b66168f026
      V21_HEAD: 710e0df35d02dd6c0883db68bb34db66174c427c
      MAIN_PRIVATE_SIGNER: 211EBB33C98359E8F49F0423231826DF22B04643BE418754C939ECB2FFC1435D
      LAB_V20_PRIVATE_SIGNER: 22C00CAEA111CF5725CA17D2BA51287DFDCEEB67015BFFA2F574235447B19FC1
    steps:
      - name: Checkout exact public branch without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Fail-closed scope, source and publication-safety audit
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/lab/public-v021-pcm-window-evidence-20261119
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$V21_HEAD" HEAD
          test "$(git rev-parse "$V21_HEAD^")" = "$PUBLIC_BASE_HEAD"
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          root = Path('labs/groq_stt_lab')
          assert root.is_dir()
          allowed = {
              '.gitignore', '.md', '.yaml', '.dart',
              '.kt', '.py', '.sh'
          }
          tracked = subprocess.check_output(
              ['git','diff','--name-only','c0c993c00c72e79b9b72697b4b2205b66168f026','HEAD'],
              text=True).splitlines()
          workflow = '.github/workflows/public-groq-lab-v021-debug-apk.yml'
          assert workflow in tracked and 50 <= len(tracked) <= 100
          for name in tracked:
              if name == workflow:
                  continue
              assert name.startswith('labs/groq_stt_lab/'), name
              path = Path(name)
              assert path.is_file() and not path.is_symlink(), name
              assert path.name == '.gitignore' or path.suffix in allowed, name
          all_lab_files = [p for p in root.rglob('*') if p.is_file()]
          assert len(all_lab_files) == len(tracked) - 1
          checks = [
              r'gsk_[A-Za-z0-9_-]{20,}',
              r'AIza[0-9A-Za-z_-]{30,}',
              r'github_pat_[A-Za-z0-9_]{20,}',
              r'-----BEGIN [A-Z ]*PRIVATE KEY-----',
              r'(?i)[A-Z0-9._%+-]+@[A-Z0-9.-]+[.][A-Z]{2,}',
              r'(?i)(?:/Users/|C:.[Uu]sers.)[^ ]+',
          ]
          for path in all_lab_files:
              assert not path.is_symlink()
              raw = path.read_bytes()
              assert bytes([0]) not in raw and len(raw) < 1000000
              s = raw.decode('utf-8')
              for pattern in checks:
                  assert not re.search(pattern, s), (str(path), pattern)
          assert (root/'lib/lab_debug_log.dart').is_file()
          assert (root/'native/GroqLabAudioDecoder.kt').is_file()
          assert (root/'tool/test_pcm_diagnostics_contract.py').is_file()
          assert 'PUBLIC_LAB_TEST_TOKEN_1234567890' in (
              root/'test/lab_groq_free_stt_transport_test.dart').read_text()
          assert 'public_lab_v46' in (
              root/'tool/verify_android_identity.py').read_text()
          print('PUBLIC_LAB_ALLOWLIST_AND_SENSITIVE_SCAN_PASS', len(all_lab_files))
          PY

      - name: Set up Java and Android build tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter with cache (public standard runner)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
          pub-cache: true

      - name: Run Gate A committed multi-Part JVM byte regression
        working-directory: labs/groq_stt_lab
        run: |
          set -euo pipefail
          command -v kotlinc
          kotlinc native/LabMultiPartProof.kt native/LabDLongPts.kt tool/host_tests/LabMultiPartProofHostTest.kt -include-runtime -d /tmp/lab-multipart-host.jar
          java -jar /tmp/lab-multipart-host.jar
          # Gate C production FGS/channel/UI integrated; compile and deliver for Owner UAT.
          kotlinc native/LabTwoHourReminder.kt tool/host_tests/LabTwoHourReminderHostTest.kt -include-runtime -d /tmp/lab-c-clock-host.jar
          java -jar /tmp/lab-c-clock-host.jar
          # D hardware-only receipts are generated by actual Android AudioRecord.
          # Host tests validate the fail-closed monotonic/unknown/reset contract.
          kotlinc native/LabDPtsEvidence.kt tool/host_tests/LabDPtsEvidenceHostTest.kt -include-runtime -d /tmp/lab-d-hardware-pts-host.jar
          java -jar /tmp/lab-d-hardware-pts-host.jar
          # True (not accelerated) 60min checkpoint, 120min reminder + 150min cap.
          kotlinc native/LabDLongClock.kt tool/host_tests/LabDLongClockHostTest.kt -include-runtime -d /tmp/lab-d-long-clock-host.jar
          java -jar /tmp/lab-d-long-clock-host.jar
          # Actual long-session PTS receipts, unavailable/reset/unaligned negative cases.
          kotlinc native/LabDLongPts.kt tool/host_tests/LabDLongPtsHostTest.kt -include-runtime -d /tmp/lab-d-long-pts-host.jar
          java -jar /tmp/lab-d-long-pts-host.jar

      - name: Run identity/PCM fail-closed regression then generate Android
        working-directory: labs/groq_stt_lab
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tool -p 'test_*.py' -v
          bash tool/bootstrap.sh
          test ! -f android/app/upload-keystore.jks
          test ! -f android/upload-keystore.properties

      - name: Flutter dependency resolution and complete positive/negative suite
        working-directory: labs/groq_stt_lab
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test

      - name: Compile native MediaCodec and committed multi-Part core
        working-directory: labs/groq_stt_lab
        run: |
          set -euo pipefail
          (cd android && ./gradlew :app:compileDebugKotlin --no-daemon --console=plain)

      - name: Build isolated Debug APK only for delivery
        if: env.LAB_BUILD_MODE == 'delivery'
        working-directory: labs/groq_stt_lab
        run: |
          set -euo pipefail
          flutter build apk --debug --no-pub --build-name=0.4.41 --build-number=46 --dart-define=LAB_BUILD_SHA="$GITHUB_SHA"
          test -s build/app/outputs/flutter-apk/app-debug.apk

      - name: APK identity, DEX, privacy signer and SHA256 provenance
        if: env.LAB_BUILD_MODE == 'delivery'
        working-directory: labs/groq_stt_lab
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-debug.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          signer="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$aapt" && test -x "$signer"
          "$signer" verify --verbose --print-certs "$apk" > /tmp/public-v046-signer.txt
          grep -Eq '^Verified using v[23] scheme.*true|^Verifies$' /tmp/public-v046-signer.txt
          "$aapt" dump badging "$apk" > /tmp/public-v046-badging.txt
          grep -Fq "name='$EXPECTED_APP_ID'" /tmp/public-v046-badging.txt
          grep -Fq "versionName='0.4.41'" /tmp/public-v046-badging.txt
          grep -Fq "versionCode='46'" /tmp/public-v046-badging.txt
          grep -Fq "launchable-activity: name='$EXPECTED_APP_ID.MainActivity'" /tmp/public-v046-badging.txt
          "$aapt" dump permissions "$apk" > /tmp/public-v046-permissions.txt
          grep -Fq 'android.permission.INTERNET' /tmp/public-v046-permissions.txt
          grep -Fq 'android.permission.RECORD_AUDIO' /tmp/public-v046-permissions.txt
          grep -Fq 'android.permission.FOREGROUND_SERVICE_MICROPHONE' /tmp/public-v046-permissions.txt
          grep -Fq 'android.permission.POST_NOTIFICATIONS' /tmp/public-v046-permissions.txt
          : > /tmp/public-v046-dex.txt
          while IFS= read -r dex; do
            unzip -p "$apk" "$dex" | strings >> /tmp/public-v046-dex.txt
          done < <(unzip -Z1 "$apk" | grep -E '^classes([0-9]+)?[.]dex$')
          grep -Fq 'Lcom/example/meeting_recorder/public_lab_v46/groq_stt_lab/MainActivity;' /tmp/public-v046-dex.txt
          grep -Fq 'Lcom/example/meeting_recorder/public_lab_v46/groq_stt_lab/GroqLabAudioDecoder;' /tmp/public-v046-dex.txt
          grep -Fq 'Lcom/example/meeting_recorder/public_lab_v46/groq_stt_lab/LabMicPartRecorder;' /tmp/public-v046-dex.txt
          grep -Fq 'Lcom/example/meeting_recorder/public_lab_v46/groq_stt_lab/LabMultiPartCapture;' /tmp/public-v046-dex.txt
          grep -Fq 'Lcom/example/meeting_recorder/public_lab_v46/groq_stt_lab/LabMultiPartSink;' /tmp/public-v046-dex.txt
          grep -Fq 'Lcom/example/meeting_recorder/public_lab_v46/groq_stt_lab/LabBackgroundRecorderService;' /tmp/public-v046-dex.txt
          grep -Fq 'Lcom/example/meeting_recorder/public_lab_v46/groq_stt_lab/LabTwoHourReminder;' /tmp/public-v046-dex.txt
          grep -Fq 'Lcom/example/meeting_recorder/public_lab_v46/groq_stt_lab/LabDPtsEvidence;' /tmp/public-v046-dex.txt
          grep -Fq 'Lcom/example/meeting_recorder/public_lab_v46/groq_stt_lab/LabDLongCapture;' /tmp/public-v046-dex.txt
          grep -Fq 'Lcom/example/meeting_recorder/public_lab_v46/groq_stt_lab/LabDLongClock;' /tmp/public-v046-dex.txt
          grep -Fq 'Lcom/example/meeting_recorder/public_lab_v46/groq_stt_lab/LabDLongPts;' /tmp/public-v046-dex.txt
          cert="$(grep -im1 'certificate SHA-256 digest' /tmp/public-v046-signer.txt | sed -E 's/^.*digest:[[:space:]]*//' | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          [[ "$cert" =~ ^[0-9A-F]{64}$ ]]
          test "$cert" != "$MAIN_PRIVATE_SIGNER"
          test "$cert" != "$LAB_V20_PRIVATE_SIGNER"
          unzip -tq "$apk"
          digest="$(sha256sum "$apk" | cut -d' ' -f1)"
          mkdir -p out
          cp "$apk" out/groq-stt-lab-v0.4.41+46-public-debug.apk
          {
            echo "REPO=easonliu714/meeting-recorder_public"
            echo "PUBLIC_BUILD_SHA=$GITHUB_SHA"
            echo "VERSION=0.4.41+46"
            echo "APPLICATION_ID=$EXPECTED_APP_ID"
            echo "APK_SHA256=$digest"
            echo "SIGNER_SHA256=$cert"
            echo "DEX_LAUNCHER_AND_DECODER=VERIFIED"
            echo "DATA_MIGRATION=NONE"
            echo "OWNER_ANDROID_UAT=NOT_VERIFIED"
            echo "GATE_C_ACCELERATED_SIMULATION=900X_OVER_24_SECOND_MIC_FIXTURE"
            echo "GATE_D_REAL_60_120_MINUTE_SOURCE=IMPLEMENTED_NOT_OWNER_TESTED"
            echo "REAL_120_MINUTE_ENDURANCE=NOT_VERIFIED"
            echo "REAL_CROSS_PART_HARDWARE_PTS=NOT_VERIFIED"
            echo "GROQ_PROVIDER_E2E=NOT_VERIFIED"
            echo "REAL_AUDIO_WINDOW_GATE=FAIL_CLOSED_NO_SILENCE_PADDING"
            echo "API_KEYS_IN_CI=NONE"
          } > out/public-v046-provenance.txt
          cat out/public-v046-provenance.txt

      - name: Upload only checked Debug APK and sanitized provenance (5 days)
        if: env.LAB_BUILD_MODE == 'delivery'
        id: immutable_lab_apk
        uses: actions/upload-artifact@v4
        with:
          name: public-groq-lab-v046-debug
          path: labs/groq_stt_lab/out/
          retention-days: 5
          if-no-files-found: error

      # The uploader returns an immutable ID; name listing may lag after upload.
      # Fail closed on absent ID. A short indexing interval prevents race-only CI failures.
      - name: Validate immutable Artifact ID before exact readback
        if: env.LAB_BUILD_MODE == 'delivery'
        env:
          UPLOADED_ARTIFACT_ID: ${{ steps.immutable_lab_apk.outputs.artifact-id }}
        run: |
          set -euo pipefail
          [[ "$UPLOADED_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          sleep 10

      - name: Read back exact uploaded Artifact ZIP and verify APK
        if: env.LAB_BUILD_MODE == 'delivery'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.immutable_lab_apk.outputs.artifact-id }}
          path: labs/groq_stt_lab/readback/

      # Downloading by immutable artifact ID places exactly one named subdirectory.
      # Require the extracted APK/receipt there; compare bytes and ZIP CRC, never skip.
      - name: Confirm downloaded APK CRC and byte identity
        if: env.LAB_BUILD_MODE == 'delivery'
        working-directory: labs/groq_stt_lab
        run: |
          set -euo pipefail
          cmp out/groq-stt-lab-v0.4.41+46-public-debug.apk readback/public-groq-lab-v046-debug/groq-stt-lab-v0.4.41+46-public-debug.apk
          cmp out/public-v046-provenance.txt readback/public-groq-lab-v046-debug/public-v046-provenance.txt
          unzip -tq readback/public-groq-lab-v046-debug/groq-stt-lab-v0.4.41+46-public-debug.apk
          echo "PUBLIC_ARTIFACT_READBACK_APK_CRC_AND_BYTE_IDENTITY_PASS"
