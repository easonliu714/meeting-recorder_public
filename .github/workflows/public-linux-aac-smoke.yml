name: Public Linux synthetic AAC safety smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-aac-safety-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthetic-aac:
    name: Synthetic 2-hour AAC / immutable source / negative tamper
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout this Public repository only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Ensure offline AAC tools are available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe

      - name: Run audited synthetic-only AAC physical positive and negative regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v tool/tests/test_groq_two_hour_physical_aac.py
